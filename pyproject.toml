[project]
name = "antennafox"
dynamic = ["version"]
description = "AntennaFox – Antenna Analysis GUI for Vector Network Analyzers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "QT_NOTICE.md", "TRADEMARKS.md", "LICENSES/*", "packaging/licenses/*"]
authors = [{ name = "Altinum Technologies e.U." }]
maintainers = [{ name = "Altinum Technologies e.U." }]
keywords = ["librevna", "vna", "antenna", "s11", "vswr", "smith-chart", "rf", "scpi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PySide6-Essentials>=6.9,<6.12",  # 6.12.0: PYSIDE-3477 leaks bool references per signal emission, crashes Python 3.11
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "reportlab>=4.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pypdf>=4.2",
    "pyright>=1.1.390",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/AltinumTechnologies/antennafox"
Publisher = "https://altinum.tech"
Issues = "https://github.com/AltinumTechnologies/antennafox/issues"

[project.gui-scripts]
antennafox = "antennafox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/antennafox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/antennafox"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "samples", "docs", "scripts", "packaging", "assets", "LICENSES", "README.md", "LICENSE", "NOTICE",
           "THIRD_PARTY_NOTICES.md", "QT_NOTICE.md", "TRADEMARKS.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md",
           "REUSE.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
timeout = 180  # a stray modal dialog must fail the run, not hang it

[tool.coverage.run]
source = ["antennafox"]
omit = ["src/antennafox/__main__.py"]  # exercised in a subprocess, see tests/test_entry_points.py

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
